name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff pytest pytest-asyncio coverage

      - name: Vérifier le linter Ruff
        run: ruff check src/ tests/

      - name: Vérifier le formatage Ruff
        run: ruff format --check src/ tests/

      - name: Lancer les tests avec couverture
        run: |
          coverage run -m pytest
          coverage report -m --fail-under=80
          coverage xml

      - name: Build Docker Image (Dry Run)
        run: docker build -t smart-finder:test .
