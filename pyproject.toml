[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-recipe-inventory-manager"
version = "0.1.0"
description = "Local AI application for food inventory and recipe suggestions"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]