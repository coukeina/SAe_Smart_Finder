services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: pg_smart_recipe_and_inventory_manager_anti_gaspillage
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_secret}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pg_data_smart_recipe_and_inventory_manager_anti_gaspillage:/var/lib/postgresql/data # persistance    
    ports:
      - "57301:5432" # (optionnel, uniquement pour debug)    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d app_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- Ollama (common to all subjects) -------  
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
    - "11434:11434"
    volumes:
    - ollama_data:/root/.ollama

  # ------- Application (subject-specific) -------  
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sae_smart_recipe_and_inventory_manager_anti_gaspillage
    ports:
    - "7860:7860"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/app/data/vector_store}
      DB_HOST: pg
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app_db}
      DB_USER: ${POSTGRES_USER:-app_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app_secret}
    volumes:
      - ./data:/app/data # persistance des vecteurs, logs...
      - ./src/smart_recipe_inventory_manager:/app/src/smart_recipe_inventory_manager
    depends_on:
      pg:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:
  pg_data_smart_recipe_and_inventory_manager_anti_gaspillage:
